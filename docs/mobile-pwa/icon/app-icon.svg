<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f2d28"/><stop offset="1" stop-color="#141310"/>
    </linearGradient>
    <radialGradient id="key" cx="0.25" cy="0.05" r="0.95">
      <stop offset="0" stop-color="#fff" stop-opacity="0.09"/><stop offset="0.65" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/><stop offset="0.6" stop-color="#e6dfd3"/><stop offset="1" stop-color="#c9c1b2"/>
    </linearGradient>
    <linearGradient id="teal" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#14a1a9"/><stop offset="0.45" stop-color="#016a71"/><stop offset="1" stop-color="#013f45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.55" y2="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/><stop offset="0.42" stop-color="#fff" stop-opacity="0.06"/><stop offset="0.43" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff0f2" stop-opacity="0.75"/><stop offset="0.5" stop-color="#7fd3d8" stop-opacity="0.15"/><stop offset="1" stop-color="#7fd3d8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="ivRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="0.2" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cast" x="-40%" y="-20%" width="180%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-200%" width="220%" height="500%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="front"><rect x="362" y="246" width="300" height="533" rx="58"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#base)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#key)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="225" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- back frames: ivory enamel -->
  <g transform="rotate(-9 512 860)">
    <g filter="url(#cast)"><rect x="236" y="300" width="236" height="420" rx="48" fill="url(#ivory)"/></g>
    <rect x="237.5" y="301.5" width="233" height="417" rx="46.5" fill="none" stroke="url(#ivRim)" stroke-width="3"/>
  </g>
  <g transform="rotate(9 512 860)">
    <g filter="url(#cast)"><rect x="552" y="300" width="236" height="420" rx="48" fill="url(#ivory)"/></g>
    <rect x="553.5" y="301.5" width="233" height="417" rx="46.5" fill="none" stroke="url(#ivRim)" stroke-width="3"/>
  </g>
  <!-- teal light falling on the tile -->
  <ellipse cx="512" cy="820" rx="190" ry="44" fill="#016a71" opacity="0.45" filter="url(#soft)"/>
  <!-- front frame: teal glass -->
  <g filter="url(#cast)"><rect x="362" y="246" width="300" height="533" rx="58" fill="url(#teal)"/></g>
  <g clip-path="url(#front)">
    <rect x="362" y="246" width="300" height="533" fill="url(#sheen)"/>
    <ellipse cx="512" cy="790" rx="150" ry="70" fill="#2fa3aa" opacity="0.4" filter="url(#soft)"/>
    <!-- caption lines in the safe area -->
    <rect x="420" y="640" width="184" height="22" rx="11" fill="#f4efe6" opacity="0.92"/>
    <rect x="452" y="680" width="120" height="22" rx="11" fill="#f4efe6" opacity="0.6"/>
  </g>
  <rect x="363.5" y="247.5" width="297" height="530" rx="56.5" fill="none" stroke="url(#glassRim)" stroke-width="3"/>
</svg>
