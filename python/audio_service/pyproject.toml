[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen-audio-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper==1.2.1",
  "soundfile>=0.12",
  "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["audio_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
